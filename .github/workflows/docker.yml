name: docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Makefile
      - '*.control'
      - 'src/**'
      - 'sql/**'
      - 'examples/**'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_major: '18'
            codename: trixie
            is_default: true
          - pg_major: '18'
            codename: bookworm
            is_default: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute Docker tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repo="${DOCKERHUB_USERNAME:-zxjcarrot}/pgvectorfast"
          pg="pg${{ matrix.pg_major }}"
          variant="${pg}-${{ matrix.codename }}"
          tags="${repo}:${variant}"
          if [ "${{ matrix.is_default }}" = "true" ]; then
            tags="${tags},${repo}:${pg},${repo}:latest"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            tags="${tags},${repo}:${ver}-${variant}"
            if [ "${{ matrix.is_default }}" = "true" ]; then
              tags="${tags},${repo}:${ver}-${pg},${repo}:${ver}"
            fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            DEBIAN_CODENAME=${{ matrix.codename }}
          load: true
          tags: pgvectorfast-smoke:${{ matrix.codename }}
          cache-from: type=gha,scope=docker-${{ matrix.pg_major }}-${{ matrix.codename }}
          cache-to: type=gha,scope=docker-${{ matrix.pg_major }}-${{ matrix.codename }},mode=max
      - name: Smoke test image
        run: |
          set -euo pipefail
          cid=$(docker run -d --shm-size=512m -e POSTGRES_HOST_AUTH_METHOD=trust pgvectorfast-smoke:${{ matrix.codename }})
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if docker exec "$cid" pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$cid" pg_isready -U postgres
          docker exec "$cid" psql -U postgres -v ON_ERROR_STOP=1 -f /usr/share/doc/pgvectorfast/examples/getting-started.sql
          docker exec "$cid" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION vector;" \
            -c "CREATE EXTENSION calico;" \
            -c "CALL calico.activate();"
          status=$(docker exec "$cid" psql -U postgres -tAc "SELECT calico.status();")
          [ "$status" = "calico" ]
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker Hub image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            DEBIAN_CODENAME=${{ matrix.codename }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=docker-${{ matrix.pg_major }}-${{ matrix.codename }}
